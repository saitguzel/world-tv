org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

# AGP 9 applies Kotlin itself, but KSP cannot work with that built-in Kotlin —
# and Room and Hilt both run through KSP. So built-in Kotlin is switched off and
# the kotlin-android plugin is applied explicitly, as AGP's own error instructs.
android.builtInKotlin=false

kotlin.code.style=official

# Room: export schemas for migration tests
room.incremental=true
