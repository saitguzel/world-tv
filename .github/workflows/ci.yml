name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from `assemble` so a broken state machine and a broken build give separate
  # signals. Both need the Android SDK regardless — Gradle configures every project in
  # the build, and AGP will not configure without it.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # :core:model and :data:health are plain Kotlin/JVM modules, so these run on the
      # JVM in seconds: the health state machine, HLS and XMLTV parsing, URL
      # classification, host throttling, the zap queue and track selection.
      - name: JVM module tests
        run: ./gradlew --no-daemon :core:model:test :data:health:test

      # Android library modules build a debug variant first, hence the longer name.
      - name: Android unit tests
        run: >
          ./gradlew --no-daemon
          :data:sync:testDebugUnitTest
          :feature:catalog:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  # The gate that matters most here: Room/KSP, Hilt and Compose code generation cannot
  # be checked any other way.
  assemble:
    name: Assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worldtv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
